name: Build

# Frozen, zero-dependency artifacts. Users download one file and run it --
# no Python, no pip, no system packages. Models are NOT bundled (1-2GB);
# they are fetched on first run into the platformdirs data dir.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # NOTE: building on ubuntu-latest links against that runner's glibc,
          # so the artifact needs a reasonably recent distro. If wider distro
          # support is ever needed, move this leg into a manylinux container.
          - os: ubuntu-latest
            target: linux-x86_64
          - os: macos-latest
            target: macos-arm64
          - os: windows-latest
            target: windows-x86_64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # PyInstaller's sounddevice hook collects the *system* libportaudio on
      # Linux and copies it into the bundle -- so this apt package is a build
      # requirement only. End users install nothing.
      - name: Install PortAudio (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv sync --dev

      # tools/freeze.py, not a bare pyinstaller call: uv's managed CPython
      # ships _tkinter.so with no RPATH, so PyInstaller cannot resolve the
      # Tcl/Tk shared libraries and silently omits them. The build succeeds,
      # the artifact is the right size, and it dies on its first import.
      - name: Freeze
        run: uv run python tools/freeze.py

      # CI going green on a binary that cannot start is exactly the failure
      # this workflow existed to catch and did not. --selftest imports what a
      # real launch needs and reports by exit status alone: a --windowed build
      # on Windows is a GUI-subsystem binary with nowhere to print, so nothing
      # that inspects output works on all three platforms.
      - name: Smoke-test the artifact
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Windows) BIN="dist/voicekey/voicekey.exe" ;;
            macOS)   BIN="dist/voicekey.app/Contents/MacOS/voicekey" ;;
            *)       BIN="dist/voicekey/voicekey" ;;
          esac
          ls -l "$BIN"
          "$BIN" --selftest
          echo "artifact starts and imports cleanly"

      - name: Package
        shell: bash
        run: |
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "../voicekey-${{ matrix.target }}.zip" voicekey
          else
            tar czf "../voicekey-${{ matrix.target }}.tar.gz" voicekey*
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: voicekey-${{ matrix.target }}
          path: voicekey-${{ matrix.target }}.*
          if-no-files-found: error
