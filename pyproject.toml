[project]
name = "voicekey"
version = "0.1.0"
description = "Hotkey-triggered local speech-to-text. Press, speak, paste."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Shane Zhang" }]

dependencies = [
    "numpy>=2.1",
    # CPU everywhere; also provides CoreML EP on macOS at no extra cost.
    "onnxruntime>=1.20",
    "sounddevice>=0.5",
    "platformdirs>=4.3",
]

[project.optional-dependencies]
# Linux/Windows x86_64 only, and ~2GB installed. Kept out of the base install
# so the CPU build stays small and works everywhere.
#
# onnxruntime-gpu does NOT bundle the CUDA runtime -- its provider .so links
# against cuBLAS/cuDNN/cuRAND and, when they are missing, ONNX Runtime falls
# back to CPU *silently*. So the runtime libraries are pinned here explicitly
# rather than left to the user. They live on NVIDIA's index (see [tool.uv]),
# and voicekey.cuda dlopens them at startup because ORT 1.30 does not search
# CUDA 13's nvidia/cu13/lib layout.
cuda = [
    "onnxruntime-gpu>=1.30",
    "nvidia-cudnn-cu13>=9.26",
    "nvidia-cuda-runtime>=13.4",
    "nvidia-curand>=10.4",
    "nvidia-cufft>=12.4",
    "nvidia-cusparse>=12.8",
    "nvidia-cusolver>=12.3",
]

[tool.uv]
# nvidia-cublas and friends for CUDA 13 are published here, not on PyPI (the
# PyPI names of the same packages are redirect stubs).
extra-index-url = ["https://pypi.nvidia.com"]

[project.scripts]
voicekey = "voicekey.__main__:main"

[dependency-groups]
dev = [
    "ruff>=0.14",
    "pytest>=8.3",
    "pyinstaller>=6.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voicekey"]

# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "UP",        # pyupgrade
    "B",         # bugbear
    "SIM",       # simplify
    "RUF",       # ruff-specific
    "NPY",       # numpy-specific
]
ignore = [
    "E501",      # line length is handled by the formatter
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
