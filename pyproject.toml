[project]
name = "voicekey"
version = "0.1.0"
description = "Hotkey-triggered local speech-to-text. Press, speak, paste."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Shane Zhang" }]

dependencies = [
    "numpy>=2.1",
    # CPU everywhere; also provides CoreML EP on macOS at no extra cost.
    "onnxruntime>=1.20",
    "sounddevice>=0.5",
    "platformdirs>=4.3",
]

[project.optional-dependencies]
# Linux/Windows x86_64 only. Kept out of the base install so the CPU build
# stays small and works everywhere; see STATE.md "Provider is a runtime probe".
cuda = ["onnxruntime-gpu>=1.20"]

[project.scripts]
voicekey = "voicekey.__main__:main"

[dependency-groups]
dev = [
    "ruff>=0.14",
    "pytest>=8.3",
    "pyinstaller>=6.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voicekey"]

# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "UP",        # pyupgrade
    "B",         # bugbear
    "SIM",       # simplify
    "RUF",       # ruff-specific
    "NPY",       # numpy-specific
]
ignore = [
    "E501",      # line length is handled by the formatter
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
